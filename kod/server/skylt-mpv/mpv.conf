# Min Butik skylt (2026-11-13), mätt med mpv IPC på Pi 4 + 1080p-skärm:
# - profile=fast: standardfiltren (lanczos/hermite) tog ca 86 ms per bildruta -> 20 tappade bildrutor/s
# - video-sync=display-resample: följ skärmens uppdatering i stället för klockan -> 0 tappade bildrutor
# hwdec utan kopiering och vridningen sätts i scripts/minbutik-skylt.lua (skylt-play anger egna värden).
profile=fast
video-sync=display-resample
# Skärmkretsen visar videon direkt (overlay): exakt 60 bilder/s, 0 ms grafikarbete per bild.
# Kräver liggande, förvridna filer (skyltvrid.py) – skärmkretsen kan inte vrida 90°.
# gpu-hwdec-interop=drmprime-overlay  (AVSTÄNGD: videon hamnade inte på något plan -> svart skärm)
